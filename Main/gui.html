<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>TARZ</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    :root {
      --bg: #0a0a0a;
      --surface: #111;
      --surface2: #191919;
      --border: #222;
      --border2: #2e2e2e;
      --text: #d0d0d0;
      --muted: #555;
      --muted2: #383838;
      --accent: #888;
      --white: #fff;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .brand {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #666;
      text-transform: uppercase;
      font-family: 'Space Mono', monospace
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .model-tag {
      font-size: 0.6rem;
      color: var(--muted2);
      letter-spacing: 0.06em;
      padding: 2px 7px;
      border: 1px solid var(--border);
      border-radius: 3px;
      font-family: 'Space Mono', monospace
    }

    /* ── Toggles ── */
    .voice-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer
    }

    .voice-label {
      font-size: 0.6rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-family: 'Space Mono', monospace
    }

    .switch {
      position: relative;
      width: 28px;
      height: 15px
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0
    }

    .slider {
      position: absolute;
      inset: 0;
      background: var(--border2);
      border-radius: 10px;
      transition: 0.2s
    }

    .slider::before {
      content: '';
      position: absolute;
      width: 10px;
      height: 10px;
      background: #444;
      border-radius: 50%;
      left: 2px;
      top: 2.5px;
      transition: 0.2s
    }

    .switch input:checked+.slider {
      background: #2e2e2e
    }

    .switch input:checked+.slider::before {
      transform: translateX(13px);
      background: #aaa
    }

    /* ── Ctrl+Space hint ── */
    .hotkey-hint {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      color: var(--muted2);
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 3px;
      cursor: pointer;
    }

    .hotkey-hint:hover {
      border-color: #444;
      color: #888
    }

    .hotkey-hint span {
      color: #555
    }

    /* ── Main ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      padding: 0 18px
    }

    /* ── Planet wrap ── */
    .planet-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 0 8px;
      flex-shrink: 0;
      transition: all 0.4s
    }

    .planet-wrap.has-messages {
      padding: 6px 0 4px
    }

    .planet-wrap.has-messages svg {
      width: 52px !important;
      height: 52px !important
    }

    .planet-wrap.has-messages .planet-tagline {
      display: none
    }

    .planet-tagline {
      font-size: 0.62rem;
      color: var(--muted2);
      letter-spacing: 0.14em;
      margin-top: 10px;
      text-transform: uppercase;
      font-family: 'Space Mono', monospace
    }

    /* ── Chat ── */
    .chat {
      width: 100%;
      max-width: 560px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 4px 0 6px
    }

    .chat::-webkit-scrollbar {
      width: 2px
    }

    .chat::-webkit-scrollbar-thumb {
      background: var(--border)
    }

    .msg {
      padding: 6px 0;
      animation: fi 0.2s ease
    }

    @keyframes fi {
      from {
        opacity: 0;
        transform: translateY(5px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .msg-sender {
      font-size: 0.58rem;
      color: var(--muted2);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 3px;
      font-family: 'Space Mono', monospace
    }

    .msg.tarz .msg-sender {
      color: #555
    }

    .bubble {
      display: inline-block;
      max-width: 90%;
      padding: 9px 13px;
      border-radius: 8px;
      font-size: 0.87rem;
      line-height: 1.6;
      color: var(--text);
      white-space: pre-wrap;
      word-wrap: break-word
    }

    .msg.tarz .bubble {
      background: var(--surface);
      border: 1px solid var(--border)
    }

    .msg.user .bubble {
      background: var(--surface2);
      border: 1px solid var(--border2);
      margin-left: auto;
      display: block
    }

    .msg.user {
      text-align: right
    }

    .msg.cancelled .bubble {
      color: var(--muted);
      font-style: italic
    }

    /* ── Thinking ── */
    .thinking {
      padding: 6px 0
    }

    .thinking-dots {
      display: flex;
      gap: 4px;
      align-items: center
    }

    .thinking-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--muted2);
      animation: tp 1.2s ease-in-out infinite
    }

    .thinking-dot:nth-child(2) {
      animation-delay: .2s
    }

    .thinking-dot:nth-child(3) {
      animation-delay: .4s
    }

    @keyframes tp {

      0%,
      80%,
      100% {
        transform: scale(0.7);
        opacity: 0.3
      }

      40% {
        transform: scale(1);
        opacity: 1
      }
    }

    /* ── Input ── */
    .input-area {
      width: 100%;
      max-width: 560px;
      padding: 10px 0 16px;
      flex-shrink: 0
    }

    .input-box {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s
    }

    .input-box:focus-within {
      border-color: #3a3a3a
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 0;
      padding: 10px 12px
    }

    #textInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      resize: none;
      min-height: 22px;
      max-height: 110px;
      line-height: 1.5;
      padding: 2px 8px 2px 0
    }

    #textInput::placeholder {
      color: var(--muted2)
    }

    .input-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0
    }

    .action-btn {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s
    }

    .action-btn:hover {
      background: var(--surface2);
      color: var(--text)
    }

    .action-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed
    }

    .action-btn svg {
      width: 15px;
      height: 15px
    }

    .send-btn {
      background: var(--surface2);
      color: var(--text)
    }

    /* ── Stop button ── */
    .stop-btn {
      display: none;
      background: #1e1e1e;
      color: #888;
      border: 1px solid #333
    }

    .stop-btn.visible {
      display: flex
    }

    .stop-btn:hover {
      background: #2a2a2a;
      color: #bbb
    }

    .input-hint {
      font-size: 0.58rem;
      color: var(--muted2);
      padding: 5px 13px 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      font-family: 'Space Mono', monospace
    }

    .hint-key {
      padding: 1px 4px;
      border: 1px solid var(--border2);
      border-radius: 2px;
      font-size: 0.56rem;
      color: var(--muted2);
      margin: 0 2px
    }

    #micStatus {
      color: var(--muted2)
    }

    #micStatus.active {
      color: #888
    }
  </style>
</head>

<body>

  <script>
    const chat = document.getElementById('chat');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');
    const stopBtn = document.getElementById('stopBtn');
    const voiceToggle = document.getElementById('voiceToggle');
    const listenToggle = document.getElementById('listenToggle');
    const ctrlSpaceBtn = document.getElementById('ctrlSpaceBtn');
    const orbWrap = document.getElementById('orbWrap');
    const micStatus = document.getElementById('micStatus');

    let isListening = false;
    let listenMode = false;
    let isSending = false;
    let cancelled = false;
    let hasMessages = false;

    // Auto-resize textarea
    textInput.addEventListener('input', () => {
      textInput.style.height = 'auto';
      textInput.style.height = Math.min(textInput.scrollHeight, 110) + 'px';
    });

    // Enter = send, Shift+Enter = newline
    textInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    // Ctrl+Space = voice input (keyboard shortcut)
    document.addEventListener('keydown', e => {
      if (e.ctrlKey && e.code === 'Space') {
        e.preventDefault();
        if (!isListening) triggerVoice();
      }
    });
    ctrlSpaceBtn.addEventListener('click', () => {
      if (!isListening) triggerVoice();
    });

    function addMessage(text, sender, extra = '') {
      if (!hasMessages) {
        hasMessages = true;
        orbWrap.classList.add('has-messages');
      }
      const div = document.createElement('div');
      div.className = `msg ${sender} ${extra}`;
      div.innerHTML = `<div class="msg-sender">${sender === 'tarz' ? 'tarz' : 'you'}</div><div class="bubble"></div>`;
      div.querySelector('.bubble').textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function showThinking() {
      const div = document.createElement('div');
      div.className = 'thinking'; div.id = 'thinking';
      div.innerHTML = `<div class="msg-sender">tarz</div>
    <div class="thinking-dots">
      <div class="thinking-dot"></div>
      <div class="thinking-dot"></div>
      <div class="thinking-dot"></div>
    </div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
    function hideThinking() { const e = document.getElementById('thinking'); if (e) e.remove(); }

    function setThinkingState(on) {
      isSending = on;
      sendBtn.disabled = on;
      if (on) { stopBtn.classList.add('visible'); }
      else { stopBtn.classList.remove('visible'); }
    }

    async function sendMessage() {
      const text = textInput.value.trim();
      if (!text || isSending) return;

      addMessage(text, 'user');
      textInput.value = '';
      textInput.style.height = 'auto';
      cancelled = false;
      setThinkingState(true);
      showThinking();

      const result = await window.pywebview.api.send_message(text);

      hideThinking();
      setThinkingState(false);

      if (cancelled) {
        addMessage('Cancelled.', 'tarz', 'cancelled');
        cancelled = false;
      } else {
        addMessage(result, 'tarz');
        if (listenMode) startListening();
      }
    }

    // Stop button
    stopBtn.addEventListener('click', () => {
      cancelled = true;
      window.pywebview.api.cancel_thinking();
      hideThinking();
      setThinkingState(false);
    });

    sendBtn.addEventListener('click', sendMessage);

    // Voice toggle
    voiceToggle.addEventListener('change', () => {
      window.pywebview.api.set_tts(voiceToggle.checked);
    });

    // Listen toggle (continuous mode)
    listenToggle.addEventListener('change', () => {
      listenMode = listenToggle.checked;
      window.pywebview.api.set_listen(listenMode);
      if (listenMode) {
        micStatus.textContent = '● listening';
        micStatus.classList.add('active');
        startListening();
      } else {
        micStatus.textContent = 'voice off';
        micStatus.classList.remove('active');
        isListening = false;
      }
    });

    // Ctrl+Space one-shot voice
    async function triggerVoice() {
      if (isListening || isSending) return;
      isListening = true;
      micStatus.textContent = '● listening';
      micStatus.classList.add('active');

      const text = await window.pywebview.api.start_voice();

      isListening = false;
      if (!listenMode) {
        micStatus.textContent = 'voice off';
        micStatus.classList.remove('active');
      }
      if (text) { textInput.value = text; sendMessage(); }
    }

    // Continuous listen loop
    async function startListening() {
      if (!listenMode || isListening) return;
      isListening = true;
      const text = await window.pywebview.api.start_voice();
      isListening = false;
      if (!listenMode) return;
      if (text) { textInput.value = text; await sendMessage(); }
      else { startListening(); }
    }
  </script>
</body>

</html>
