  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #07070b;
      --surface: rgba(20, 19, 24, 0.55);
      --surface-solid: #121117;
      --border: rgba(255, 255, 255, 0.09);
      --border-bright: rgba(255, 255, 255, 0.24);
      --text: #c9c6bd;
      --text-bright: #f3f0e7;
      --muted: #75757e;
      --muted2: #46464e;
      --accent: #f0f1f5;
      --accent-soft: rgba(240, 241, 245, 0.14);
      --accent-dim: rgba(240, 241, 245, 0.35);
      --font: 'JetBrains Mono', ui-monospace, 'SF Mono', 'Consolas', monospace;
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      overflow: hidden;
    }

    body {
      color: var(--text);
      font-family: var(--font);
      display: flex;
      flex-direction: column;
      user-select: none;
    }

      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: var(--bg);

      background-size: cover;
      background-position: 55% 50%;
      animation: cosmos-pan 80s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes cosmos-pan {

      0%,
      100% {
        transform: scale(1.06) translate(0, 0);
      }

      50% {
        transform: scale(1.1) translate(-1.2%, -0.8%);
      }
    }

    .bg-vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 60% 45%, transparent 30%, rgba(4, 4, 7, 0.55) 78%, rgba(4, 4, 7, 0.92) 100%),
        linear-gradient(180deg, rgba(4, 4, 7, 0.55) 0%, rgba(4, 4, 7, 0.05) 22%, rgba(4, 4, 7, 0.05) 70%, rgba(4, 4, 7, 0.7) 100%);
    }

    .bg-scanlines {
      position: absolute;
      inset: 0;
      opacity: 0.16;
      background-image: repeating-linear-gradient(0deg, transparent 0px, transparent 2px,
          rgba(0, 0, 0, 0.5) 2px, rgba(0, 0, 0, 0.5) 3px);
    }

    .bg-grain {
      position: absolute;
      inset: 0;
      opacity: 0.05;
      background-image:
        radial-gradient(rgba(255, 255, 255, 0.6) 1px, transparent 1px);
      background-size: 3px 3px;
    }

    .twinkle-layer {
      position: absolute;
      inset: -10%;
      animation: star-drift 140s linear infinite;
    }

    @keyframes star-drift {
      0% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(-1.5%, 1%);
      }

      100% {
        transform: translate(0, 0);
      }
    }

    .twinkle {
      position: absolute;
      border-radius: 999px;
      background: #fff;
      animation: twinkle ease-in-out infinite;
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: 0.15;
        transform: scale(1);
      }

      50% {
        opacity: 0.9;
        transform: scale(1.5);
      }
    }

    /* Shooting stars: brief diagonal streak, long pause, repeat */
    .shooting-star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: transparent;
      opacity: 0;
      animation: shoot 9s ease-in infinite;
    }

    .shooting-star::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 90px;
      height: 1px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0));
      transform: rotate(-32deg);
      transform-origin: left center;
    }

    @keyframes shoot {
      0% {
        opacity: 0;
        transform: translate(0, 0);
      }

      2% {
        opacity: 1;
      }

      10% {
        opacity: 0;
        transform: translate(-160px, 90px);
      }

      100% {
        opacity: 0;
        transform: translate(-160px, 90px);
      }
    }

    /* Floating pixel debris -- small drifting asteroid clusters */
    .debris {
      position: absolute;
      animation: float-y ease-in-out infinite;
      opacity: 0.55;
    }

    .debris span {
      position: absolute;
      width: 3px;
      height: 3px;
      background: var(--muted);
    }

    @keyframes float-y {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-14px) rotate(5deg);
      }
    }

    /* ---------------- Orbiting satellite (original design) ---------------- */
    .sat-orbit {
      position: absolute;
      width: 100px;
      height: 56px;
      top: 0;
      left: 0;
      pointer-events: none;
      offset-path: ellipse(43% 36% at 50% 46%);
      offset-anchor: 50% 50%;
      offset-rotate: 0deg;
      animation: sat-orbit-move 58s linear infinite;
      filter: drop-shadow(0 0 10px rgba(240, 241, 245, 0.12));
    }

    @keyframes sat-orbit-move {
      0% {
        offset-distance: 0%;
      }

      100% {
        offset-distance: 100%;
      }
    }

    .sat-light {
      animation: sat-blink 1.7s ease-in-out infinite;
    }

    @keyframes sat-blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.15;
      }
    }

    /* Fallback position if offset-path isn't supported by the webview engine */
    @supports not (offset-path: ellipse(1% 1% at 50% 50%)) {
      .sat-orbit {
        top: 12%;
        left: 6%;
        animation: sat-drift-fallback 20s ease-in-out infinite;
      }

      @keyframes sat-drift-fallback {

        0%,
        100% {
          transform: translateY(0) rotate(-28deg);
        }

        50% {
          transform: translateY(-12px) rotate(-24deg);
        }
      }
    }

    /* ================= LAYOUT ================= */
    .app {
      position: relative;
      z-index: 10;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ================= HEADER ================= */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px;
      animation: fade-up 0.6s ease-out both;
      flex-shrink: 0;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand {
      font-size: 14px;
      letter-spacing: 0.5em;
      font-weight: 300;
      color: var(--text-bright);
      text-shadow: 0 0 18px rgba(240, 241, 245, 0.25);
    }

    .bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 11px;
    }

    .bars span {
      width: 2px;
      background: var(--muted);
      animation: flicker 4s ease-in-out infinite;
    }

    @keyframes flicker {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.55;
      }
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Ctrl+Space badge -- the signature control, always visible */
    .talk-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border: 1px solid var(--border-bright);
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent);
      font-family: var(--font);
      font-size: 10px;
      letter-spacing: 0.14em;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s, border-color 0.2s, transform 0.15s;
    }

    .talk-badge:hover {
      background: rgba(240, 241, 245, 0.22);
      transform: translateY(-1px);
    }

    .talk-badge:active {
      transform: translateY(0);
    }

    .talk-badge svg {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
    }

    .talk-badge.listening {
      background: rgba(240, 241, 245, 0.28);
      box-shadow: 0 0 22px var(--accent-dim);
      animation: pulse-badge 1.3s ease-in-out infinite;
    }

    @keyframes pulse-badge {

      0%,
      100% {
        box-shadow: 0 0 14px var(--accent-dim);
      }

      50% {
        box-shadow: 0 0 30px var(--accent-dim);
      }
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .toggle-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--muted);
    }

    .switch {
      position: relative;
      width: 28px;
      height: 15px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: 0.2s;
    }

    .slider::before {
      content: '';
      position: absolute;
      width: 9px;
      height: 9px;
      background: var(--muted);
      border-radius: 50%;
      left: 2px;
      top: 2px;
      transition: 0.2s;
    }

    .switch input:checked+.slider {
      background: var(--accent-soft);
      border-color: var(--accent-dim);
    }

    .switch input:checked+.slider::before {
      transform: translateX(13px);
      background: var(--accent);
    }

    /* ================= MAIN / HERO / CHAT ================= */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 0;
      padding: 0 22px;
    }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
      animation: fade-up 0.7s ease-out 0.15s both;
    }

    .main.has-messages .hero {
      display: none;
    }

    .hero-tagline {
      font-size: clamp(15px, 2.4vw, 21px);
      letter-spacing: 0.42em;
      font-weight: 300;
      color: rgba(243, 240, 231, 0.85);
      text-shadow: 0 0 22px rgba(255, 255, 255, 0.18);
    }

    .hero-talk-hint {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 18px;
      border: 1px solid var(--border-bright);
      border-radius: 4px;
      background: rgba(240, 241, 245, 0.08);
      color: var(--text);
      font-family: var(--font);
      font-size: 11px;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }

    .hero-talk-hint:hover {
      background: rgba(240, 241, 245, 0.16);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .hero-talk-hint svg {
      width: 14px;
      height: 14px;
      color: var(--accent);
      flex-shrink: 0;
    }

    .chat {
      width: 100%;
      max-width: 680px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 16px 0 10px;
      scrollbar-width: thin;
    }

    .main.has-messages .chat {
      flex: 1;
    }

    .chat::-webkit-scrollbar {
      width: 3px;
    }

    .chat::-webkit-scrollbar-thumb {
      background: var(--border-bright);
      border-radius: 2px;
    }

    .msg {
      padding: 7px 0;
      animation: fade-in 0.2s ease;
    }

    .msg-sender {
      font-size: 9px;
      color: var(--muted2);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .bubble {
      display: inline-block;
      max-width: 86%;
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 13px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-wrap: break-word;
      user-select: text;
    }

    .msg.tarz .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .msg.user {
      text-align: right;
    }

    .msg.user .bubble {
      background: rgba(240, 241, 245, 0.08);
      border: 1px solid rgba(240, 241, 245, 0.28);
      color: var(--text-bright);
      margin-left: auto;
    }

    .msg.cancelled .bubble {
      color: var(--muted);
      font-style: italic;
    }

    .msg.error .bubble {
      color: #c98a7a;
      border-color: rgba(201, 138, 122, 0.35);
    }

    .thinking {
      padding: 7px 0;
    }

    .thinking-dots {
      display: flex;
      gap: 4px;
      align-items: center;
      height: 20px;
    }

    .thinking-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent-dim);
      animation: tp 1.2s ease-in-out infinite;
    }

    .thinking-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .thinking-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes tp {

      0%,
      80%,
      100% {
        transform: scale(0.7);
        opacity: 0.3;
      }

      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* ================= COMPOSER ================= */
    .composer-wrap {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 0 22px 14px;
      flex-shrink: 0;
      animation: fade-up 0.7s ease-out 0.3s both;
    }

    .composer {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 0 40px -14px rgba(240, 241, 245, 0.2);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .composer:focus-within {
      border-color: var(--border-bright);
      box-shadow: 0 0 46px -10px rgba(240, 241, 245, 0.32);
    }

    .composer-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 10px 10px 14px;
    }

    #textInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: var(--text-bright);
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.6;
      min-height: 22px;
      max-height: 120px;
      padding: 5px 0;
    }

    #textInput::placeholder {
      color: var(--muted2);
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-bright);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: rgba(240, 241, 245, 0.1);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .icon-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    .icon-btn svg {
      width: 14px;
      height: 14px;
    }

    .stop-btn {
      display: none;
    }

    .composer.sending .stop-btn {
      display: flex;
    }

    .composer.sending .send-btn {
      display: none;
    }

    .composer-hint {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      font-size: 9.5px;
      letter-spacing: 0.05em;
      color: var(--muted);
      flex-wrap: wrap;
    }

    kbd {
      padding: 1px 5px;
      border: 1px solid var(--border-bright);
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-bright);
      font-size: 9px;
      font-family: var(--font);
    }

    #micStatus {
      color: var(--muted);
      white-space: nowrap;
    }

    #micStatus.active {
      color: var(--accent);
    }

    /* ================= FOOTER ================= */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 22px 14px;
      font-size: 10px;
      letter-spacing: 0.22em;
      color: var(--muted);
      flex-shrink: 0;
      animation: fade-up 0.7s ease-out 0.4s both;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--muted);
      transition: background 0.2s;
    }

    .status-dot.active {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-dim);
      animation: pulse-dot 1.5s ease-in-out infinite;
    }

    @keyframes pulse-dot {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
      }
    }

    .footer-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #clock {
      color: var(--text-bright);
      font-variant-numeric: tabular-nums;
    }

    .pulse-glyph {
      color: var(--accent);
      animation: pulse-dot 2.4s ease-in-out infinite;
    }

    @media (max-width: 560px) {
      .talk-badge-text-full {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    :focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
</head>

<body>

  <div class="bg-scene" aria-hidden="true">
    <div class="bg-image"></div>
    <div class="bg-vignette"></div>
    <div class="bg-scanlines"></div>
    <div class="bg-grain"></div>

    <div class="twinkle-layer" id="twinkles"></div>

    <div class="sat-orbit">
      <svg viewBox="0 0 140 70" width="100" height="56">
        <defs>
          <linearGradient id="satBody" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f5f6f9" />
            <stop offset="45%" stop-color="#d3d7de" />
            <stop offset="100%" stop-color="#888e99" />
          </linearGradient>
          <linearGradient id="satPanel" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="rgba(214,225,240,0.65)" />
            <stop offset="50%" stop-color="rgba(244,247,252,0.92)" />
            <stop offset="100%" stop-color="rgba(176,194,218,0.6)" />
          </linearGradient>
        </defs>
        <g transform="rotate(-22 70 35)">
          <!-- left strut + panel -->
          <line x1="54" y1="35" x2="40" y2="35" stroke="#b9bec7" stroke-width="2.2" />
          <rect x="6" y="20" width="34" height="30" rx="1.5" fill="url(#satPanel)" stroke="rgba(255,255,255,0.7)"
            stroke-width="1.6" />
          <line x1="23" y1="20" x2="23" y2="50" stroke="rgba(255,255,255,0.55)" stroke-width="1.1" />
          <line x1="6" y1="35" x2="40" y2="35" stroke="rgba(255,255,255,0.55)" stroke-width="1.1" />

          <!-- right strut + panel -->
          <line x1="86" y1="35" x2="100" y2="35" stroke="#b9bec7" stroke-width="2.2" />
          <rect x="100" y="20" width="34" height="30" rx="1.5" fill="url(#satPanel)" stroke="rgba(255,255,255,0.7)"
            stroke-width="1.6" />
          <line x1="117" y1="20" x2="117" y2="50" stroke="rgba(255,255,255,0.55)" stroke-width="1.1" />
          <line x1="100" y1="35" x2="134" y2="35" stroke="rgba(255,255,255,0.55)" stroke-width="1.1" />

          <!-- central body -->
          <rect x="52" y="25" width="36" height="20" rx="6" fill="url(#satBody)" stroke="rgba(255,255,255,0.6)"
            stroke-width="1.4" />
          <line x1="64" y1="27" x2="64" y2="43" stroke="rgba(70,74,82,0.25)" stroke-width="1.1" />
          <line x1="76" y1="27" x2="76" y2="43" stroke="rgba(70,74,82,0.25)" stroke-width="1.1" />
          <circle cx="54" cy="35" r="4" fill="#eef0f4" stroke="rgba(255,255,255,0.6)" stroke-width="1" />

          <!-- dish antenna -->
          <line x1="78" y1="25" x2="78" y2="11" stroke="#c3c7cf" stroke-width="1.6" />
          <ellipse cx="78" cy="9" rx="8" ry="3.6" fill="none" stroke="#e7e9ee" stroke-width="1.8" />

          <!-- anti-collision light -->
          <circle class="sat-light" cx="88" cy="44" r="1.8" fill="#e2705c" />
        </g>
      </svg>
    </div>

    <span class="shooting-star" style="top: 14%; left: 72%; animation-delay: 1.5s;"></span>
    <span class="shooting-star" style="top: 62%; left: 30%; animation-delay: 6.5s;"></span>
    <span class="shooting-star" style="top: 38%; left: 88%; animation-delay: 13s;"></span>

    <div class="debris" style="top: 22%; left: 8%; animation-duration: 7s;">
      <span style="top:0;left:4px;"></span><span style="top:4px;left:0;"></span>
      <span style="top:4px;left:8px;"></span><span style="top:8px;left:4px;"></span>
    </div>
    <div class="debris" style="bottom: 16%; left: 14%; animation-duration: 9s; animation-delay: 1.2s;">
      <span style="top:0;left:0;"></span><span style="top:0;left:6px;"></span>
      <span style="top:5px;left:3px;"></span>
    </div>
    <div class="debris" style="top: 68%; right: 10%; animation-duration: 8s; animation-delay: 2.4s;">
      <span style="top:0;left:3px;"></span><span style="top:4px;left:0;"></span>
      <span style="top:4px;left:7px;"></span><span style="top:8px;left:3px;"></span>
    </div>
  </div>

  <div class="app">

    <header class="header">
      <div class="brand-group">
        <h1 class="brand">T A R Z</h1>
        <div class="bars" id="barsHeader" aria-hidden="true"></div>
      </div>
      <div class="header-actions">
        <button class="talk-badge" id="talkBadge" title="Hold Ctrl+Space to talk">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" y1="19" x2="12" y2="23" />
          </svg>
          <span class="talk-badge-text-full">CTRL + SPACE&nbsp;·&nbsp;TALK</span>
        </button>
        <label class="toggle" for="voiceToggle">
          <span class="toggle-label">VOICE</span>
          <span class="switch">
            <input type="checkbox" id="voiceToggle" checked />
            <span class="slider"></span>
          </span>
        </label>
      </div>
    </header>

    <main class="main" id="main">
      <div class="hero" id="hero">
        <p class="hero-tagline">// ASK ME ANYTHING</p>
        <button class="hero-talk-hint" id="heroTalkHint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" y1="19" x2="12" y2="23" />
          </svg>
          Hold <kbd>Ctrl</kbd>&nbsp;+&nbsp;<kbd>Space</kbd> to talk
        </button>
      </div>
      <div class="chat" id="chat"></div>
    </main>

    <div class="composer-wrap">
      <div class="composer" id="composer">
        <div class="composer-row">
          <textarea id="textInput" rows="1" placeholder="Message TARZ..."></textarea>
          <button class="icon-btn stop-btn" id="stopBtn" title="Stop">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="6" width="12" height="12" rx="1.5" />
            </svg>
          </button>
          <button class="icon-btn send-btn" id="sendBtn" title="Send (Enter)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5" />
              <polyline points="5 12 12 5 19 12" />
            </svg>
          </button>
        </div>
        <div class="composer-hint">
          <span><kbd>Enter</kbd> send &nbsp;·&nbsp; <kbd>Shift+Enter</kbd> newline &nbsp;·&nbsp; <kbd>Ctrl+Space</kbd>
            talk</span>
          <span id="micStatus">voice on</span>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-left">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">READY</span>
        <div class="bars" id="barsFooter" aria-hidden="true"></div>
      </div>
      <div class="footer-right">
        <span id="clock">--:--:--</span>
        <span class="pulse-glyph" aria-hidden="true">✦</span>
      </div>
    </footer>

  </div>

  <script>
    // ============================================================
    // Element refs
    // ============================================================
    const chat = document.getElementById('chat');
    const main = document.getElementById('main');
    const hero = document.getElementById('hero');
    const textInput = document.getElementById('textInput');
    const composer = document.getElementById('composer');
    const sendBtn = document.getElementById('sendBtn');
    const stopBtn = document.getElementById('stopBtn');
    const talkBadge = document.getElementById('talkBadge');
    const heroTalkHint = document.getElementById('heroTalkHint');
    const voiceToggle = document.getElementById('voiceToggle');
    const micStatus = document.getElementById('micStatus');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const clockEl = document.getElementById('clock');

    // ============================================================
    // State
    // ============================================================
    let isSending = false;
    let isListening = false;
    let hasMessages = false;
    let voiceEnabled = true;
    let cancelled = false;
    let apiReady = typeof window.pywebview !== 'undefined' && !!window.pywebview.api;

    // ============================================================
    // Decorative: equalizer bars + starfield twinkles
    // ============================================================
    function buildBars(container, count) {
      if (!container) return;
      const frag = document.createDocumentFragment();
      for (let i = 0; i < count; i++) {
        const span = document.createElement('span');
        span.style.height = `${20 + ((i * 37) % 80)}%`;
        span.style.animationDelay = `${(i * 137) % 1000}ms`;
        frag.appendChild(span);
      }
      container.appendChild(frag);
    }
    buildBars(document.getElementById('barsHeader'), 16);
    buildBars(document.getElementById('barsFooter'), 10);

    function buildTwinkles(container, count) {
      const frag = document.createDocumentFragment();
      for (let i = 0; i < count; i++) {
        const seed = i * 9301 + 49297;
        const rand = n => ((seed * (n + 1)) % 1000) / 1000;
        const s = document.createElement('span');
        s.className = 'twinkle';
        s.style.top = `${rand(1) * 100}%`;
        s.style.left = `${rand(2) * 100}%`;
        const size = 1 + rand(3) * 1.6;
        s.style.width = `${size}px`;
        s.style.height = `${size}px`;
        s.style.animationDelay = `${rand(4) * 5}s`;
        s.style.animationDuration = `${2.5 + rand(5) * 4}s`;
        frag.appendChild(s);
      }
      container.appendChild(frag);
    }
    buildTwinkles(document.getElementById('twinkles'), 60);

    // ============================================================
    // Clock
    // ============================================================
    function tickClock() {
      const d = new Date();
      const p = n => String(n).padStart(2, '0');
      clockEl.textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }
    tickClock();
    setInterval(tickClock, 1000);

    // ============================================================
    // pywebview bridge readiness
    // ============================================================
    window.addEventListener('pywebviewready', () => { apiReady = true; });

    function apiOrNull() {
      if (typeof window.pywebview !== 'undefined' && window.pywebview.api) {
        apiReady = true;
        return window.pywebview.api;
      }
      return null;
    }

    // ============================================================
    // Chat rendering
    // ============================================================
    function setHasMessages() {
      if (!hasMessages) {
        hasMessages = true;
        main.classList.add('has-messages');
      }
    }

    function addMessage(text, sender, extraClass = '') {
      setHasMessages();
      const div = document.createElement('div');
      div.className = `msg ${sender} ${extraClass}`.trim();
      const senderEl = document.createElement('div');
      senderEl.className = 'msg-sender';
      senderEl.textContent = sender === 'tarz' ? 'tarz' : 'you';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      div.appendChild(senderEl);
      div.appendChild(bubble);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function showThinking() {
      const div = document.createElement('div');
      div.className = 'thinking';
      div.id = 'thinking';
      div.innerHTML = `
        <div class="msg-sender">tarz</div>
        <div class="thinking-dots">
          <span class="thinking-dot"></span>
          <span class="thinking-dot"></span>
          <span class="thinking-dot"></span>
        </div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
    function hideThinking() {
      const el = document.getElementById('thinking');
      if (el) el.remove();
    }

    // ============================================================
    // Status / sending state
    // ============================================================
    function setStatus(state) {
      // state: 'ready' | 'listening' | 'thinking'
      statusDot.classList.toggle('active', state !== 'ready');
      statusText.textContent = state === 'listening' ? 'LISTENING' : state === 'thinking' ? 'THINKING' : 'READY';
    }

    function setSendingState(on) {
      isSending = on;
      composer.classList.toggle('sending', on);
      sendBtn.disabled = false;
      setStatus(on ? 'thinking' : (isListening ? 'listening' : 'ready'));
    }

    function setListeningState(on) {
      isListening = on;
      talkBadge.classList.toggle('listening', on);
      micStatus.textContent = on ? '● listening' : (voiceEnabled ? 'voice on' : 'voice off');
      micStatus.classList.toggle('active', on);
      setStatus(on ? 'listening' : (isSending ? 'thinking' : 'ready'));
    }

    // ============================================================
    // Core actions
    // ============================================================
    async function sendMessage(overrideText) {
      const text = (overrideText !== undefined ? overrideText : textInput.value).trim();
      if (!text || isSending) return;

      addMessage(text, 'user');
      textInput.value = '';
      textInput.style.height = 'auto';
      cancelled = false;
      setSendingState(true);
      showThinking();

      const api = apiOrNull();
      if (!api) {
        hideThinking();
        setSendingState(false);
        addMessage('pywebview API not available. Is gui_backend.py running this file?', 'tarz', 'error');
        return;
      }

      try {
        const result = await api.send_message(text);
        hideThinking();
        setSendingState(false);

        if (cancelled || result === '__cancelled__') {
          addMessage('Cancelled.', 'tarz', 'cancelled');
          cancelled = false;
        } else {
          addMessage(result, 'tarz');
        }
      } catch (err) {
        hideThinking();
        setSendingState(false);
        addMessage(`Error: ${err}`, 'tarz', 'error');
      }
    }

    function cancelThinking() {
      cancelled = true;
      const api = apiOrNull();
      if (api) api.cancel_thinking();
      hideThinking();
      setSendingState(false);
    }

    async function triggerVoice() {
      if (isListening || isSending) return;
      const api = apiOrNull();
      if (!api) {
        addMessage('pywebview API not available. Is gui_backend.py running this file?', 'tarz', 'error');
        return;
      }
      setListeningState(true);
      try {
        const text = await api.start_voice();
        setListeningState(false);
        if (text) {
          textInput.value = text;
          sendMessage(text);
        }
      } catch (err) {
        setListeningState(false);
        addMessage(`Voice error: ${err}`, 'tarz', 'error');
      }
    }

    function setVoiceEnabled(on) {
      voiceEnabled = on;
      const api = apiOrNull();
      if (api) api.set_tts(on);
      if (!isListening) micStatus.textContent = on ? 'voice on' : 'voice off';
    }

    // ============================================================
    // Wiring
    // ============================================================
    textInput.addEventListener('input', () => {
      textInput.style.height = 'auto';
      textInput.style.height = Math.min(textInput.scrollHeight, 120) + 'px';
    });
    textInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    sendBtn.addEventListener('click', () => sendMessage());
    stopBtn.addEventListener('click', cancelThinking);

    talkBadge.addEventListener('click', triggerVoice);
    heroTalkHint.addEventListener('click', triggerVoice);

    document.addEventListener('keydown', e => {
      if (e.ctrlKey && e.code === 'Space') {
        e.preventDefault();
        triggerVoice();
      }
    });

    voiceToggle.addEventListener('change', () => setVoiceEnabled(voiceToggle.checked));

    // Initial focus
    textInput.focus();
    setStatus('ready');
  </script>

</body>
